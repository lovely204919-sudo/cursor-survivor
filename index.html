<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cursor Survivor</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #080808; cursor: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ── Setup ─────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ── State ─────────────────────────────────────────────────────
const S = {
  phase: 'idle',   // idle | running | dead
  cursor: { x: 0, y: 0 },
  enemies: [], particles: [],
  frame: 0, time: 0, bestTime: 0,
  level: 0, bpm: 80,
  beatFlash: 0,
  spawnOnBeat: false,
};

// ── Input ─────────────────────────────────────────────────────
canvas.addEventListener('mousemove', e => {
  S.cursor.x = e.clientX;
  S.cursor.y = e.clientY;
});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  S.cursor.x = e.touches[0].clientX;
  S.cursor.y = e.touches[0].clientY;
}, { passive: false });
canvas.addEventListener('click', () => {
  if (S.phase !== 'running') startGame();
});
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  S.cursor.x = e.touches[0].clientX;
  S.cursor.y = e.touches[0].clientY;
  if (S.phase !== 'running') startGame();
}, { passive: false });

// ── Audio ─────────────────────────────────────────────────────
let audioCtx = null, masterGain = null;
let nextBeatTime = 0, beatInterval = 0;
let beatScheduler = null, audioRunning = false;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.45;
  masterGain.connect(audioCtx.destination);
}

function startBeat(bpm) {
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  beatInterval = 60 / bpm;
  nextBeatTime = audioCtx.currentTime + 0.1;
  audioRunning = true;
  scheduleBeat();
}

function setBPM(bpm) {
  beatInterval = 60 / bpm;
}

function stopBeat() {
  audioRunning = false;
  if (beatScheduler) clearTimeout(beatScheduler);
}

function scheduleBeat() {
  if (!audioRunning) return;
  while (nextBeatTime < audioCtx.currentTime + 0.15) {
    playBeat(nextBeatTime);
    const delay = Math.max(0, (nextBeatTime - audioCtx.currentTime - 0.016) * 1000);
    setTimeout(() => {
      if (S.phase === 'running') {
        S.beatFlash = 8;
        S.spawnOnBeat = true;
      }
    }, delay);
    nextBeatTime += beatInterval;
  }
  beatScheduler = setTimeout(scheduleBeat, 80);
}

function playBeat(t) {
  const ac = audioCtx, mg = masterGain;

  // Kick
  const k = ac.createOscillator(), kg = ac.createGain();
  k.connect(kg); kg.connect(mg);
  k.frequency.setValueAtTime(150, t);
  k.frequency.exponentialRampToValueAtTime(38, t + 0.1);
  kg.gain.setValueAtTime(0.85, t);
  kg.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
  k.start(t); k.stop(t + 0.25);

  // Hi-hat x2
  for (let i = 0; i < 2; i++) {
    const ht = t + i * beatInterval * 0.5;
    const buf = ac.createBuffer(1, ac.sampleRate * 0.05, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let j = 0; j < d.length; j++) d[j] = Math.random() * 2 - 1;
    const src = ac.createBufferSource(); src.buffer = buf;
    const hpf = ac.createBiquadFilter(); hpf.type = 'highpass'; hpf.frequency.value = 8000;
    const hg = ac.createGain();
    hg.gain.setValueAtTime(i === 0 ? 0.12 : 0.06, ht);
    hg.gain.exponentialRampToValueAtTime(0.001, ht + 0.05);
    src.connect(hpf); hpf.connect(hg); hg.connect(mg);
    src.start(ht); src.stop(ht + 0.06);
  }

  // Bass
  const bassFreq = Math.random() > 0.5 ? 55 : 82;
  const b = ac.createOscillator(), bg = ac.createGain();
  b.type = 'sawtooth'; b.frequency.value = bassFreq;
  const lpf = ac.createBiquadFilter(); lpf.type = 'lowpass'; lpf.frequency.value = 200;
  b.connect(lpf); lpf.connect(bg); bg.connect(mg);
  bg.gain.setValueAtTime(0.38, t);
  bg.gain.exponentialRampToValueAtTime(0.001, t + beatInterval * 0.65);
  b.start(t); b.stop(t + beatInterval * 0.65);
}

// ── Helpers ───────────────────────────────────────────────────
function rand(a, b) { return a + Math.random() * (b - a); }

function spawnEnemy() {
  const lv = S.level;
  const edge = Math.floor(Math.random() * 4);
  let x, y;
  if (edge === 0)      { x = rand(0, W); y = -20; }
  else if (edge === 1) { x = W + 20;    y = rand(0, H); }
  else if (edge === 2) { x = rand(0, W); y = H + 20; }
  else                 { x = -20;        y = rand(0, H); }

  const spd = rand(0.3 + lv * 0.12, 0.7 + lv * 0.2);
  const r   = rand(9, Math.max(9, 19 - lv * 0.5));
  const dx = S.cursor.x - x, dy = S.cursor.y - y;
  const dist = Math.hypot(dx, dy) || 1;
  return {
    x, y,
    vx: (dx / dist) * spd,
    vy: (dy / dist) * spd,
    r,
    homing: Math.random() < 0.08 + lv * 0.04,
  };
}

// ── Game Logic ────────────────────────────────────────────────
function startGame() {
  S.phase = 'running';
  S.enemies = []; S.particles = [];
  S.frame = 0; S.time = 0;
  S.level = 0; S.bpm = 80;
  S.beatFlash = 0; S.spawnOnBeat = false;
  S.cursor.x = W / 2; S.cursor.y = H / 2;
  startBeat(80);
}

function update() {
  S.frame++;
  S.time++;

  // Level up every 10s (600 frames @ 60fps)
  const newLevel = Math.floor(S.time / 600);
  if (newLevel !== S.level) {
    S.level = newLevel;
    S.bpm = Math.min(180, 80 + S.level * 10);
    setBPM(S.bpm);
  }

  // Spawn on beat
  if (S.spawnOnBeat) {
    S.spawnOnBeat = false;
    const count = 1 + Math.floor(S.level / 2);
    for (let i = 0; i < count; i++) S.enemies.push(spawnEnemy());
  }

  // Update enemies
  S.enemies = S.enemies.filter(e => e.x > -80 && e.x < W+80 && e.y > -80 && e.y < H+80);
  for (const e of S.enemies) {
    if (e.homing) {
      const dx = S.cursor.x - e.x, dy = S.cursor.y - e.y;
      const d = Math.hypot(dx, dy) || 1;
      const spd = Math.hypot(e.vx, e.vy);
      e.vx += (dx/d)*0.07; e.vy += (dy/d)*0.07;
      const ns = Math.hypot(e.vx, e.vy);
      if (ns > spd * 1.6) { e.vx = e.vx/ns*spd*1.6; e.vy = e.vy/ns*spd*1.6; }
    }
    e.x += e.vx; e.y += e.vy;
  }

  // Collision
  for (const e of S.enemies) {
    if (Math.hypot(S.cursor.x - e.x, S.cursor.y - e.y) < e.r + 6) {
      S.phase = 'dead';
      stopBeat();
      if (S.time > S.bestTime) S.bestTime = S.time;
      for (let i = 0; i < 28; i++) {
        const a = Math.random()*Math.PI*2, spd = rand(2, 9);
        S.particles.push({
          x: S.cursor.x, y: S.cursor.y,
          vx: Math.cos(a)*spd, vy: Math.sin(a)*spd,
          life: 55, max: 55, r: rand(3,7), hue: rand(0,40),
        });
      }
      break;
    }
  }

  // Update particles
  S.particles = S.particles.filter(p => p.life > 0);
  for (const p of S.particles) {
    p.x+=p.vx; p.y+=p.vy; p.vx*=.91; p.vy*=.91; p.life--;
  }

  if (S.beatFlash > 0) S.beatFlash--;
}

// ── Draw ──────────────────────────────────────────────────────
function draw() {
  // Background
  ctx.fillStyle = '#080808';
  ctx.fillRect(0, 0, W, H);

  // Beat flash
  if (S.beatFlash > 0 && S.phase === 'running') {
    ctx.fillStyle = `rgba(0,229,160,${(S.beatFlash/8)*0.1})`;
    ctx.fillRect(0, 0, W, H);
  }

  // Grid
  const ga = 0.025 + (S.beatFlash/8)*0.04;
  ctx.strokeStyle = `rgba(255,255,255,${ga})`;
  ctx.lineWidth = 1;
  for (let x=0; x<W; x+=40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y=0; y<H; y+=40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  if (S.phase === 'idle')    { drawIdle(); return; }
  if (S.phase === 'dead')    { drawDead(); return; }

  // Enemies
  for (const e of S.enemies) {
    const prox = Math.max(0, 1 - Math.hypot(S.cursor.x-e.x, S.cursor.y-e.y)/180);
    const pulse = S.beatFlash > 0 ? 1.15 : 1;

    const g = ctx.createRadialGradient(e.x,e.y,0,e.x,e.y,e.r*3);
    g.addColorStop(0, `rgba(255,${(80+prox*40)|0},0,${0.12+prox*0.2})`);
    g.addColorStop(1, 'rgba(255,50,0,0)');
    ctx.beginPath(); ctx.arc(e.x,e.y,e.r*3*pulse,0,Math.PI*2);
    ctx.fillStyle = g; ctx.fill();

    ctx.beginPath(); ctx.arc(e.x,e.y,e.r*pulse,0,Math.PI*2);
    const bg = ctx.createRadialGradient(e.x-e.r*.3,e.y-e.r*.3,0,e.x,e.y,e.r);
    bg.addColorStop(0, `rgb(255,${(130-prox*80)|0},${(40-prox*30)|0})`);
    bg.addColorStop(1, `rgb(${(200-prox*30)|0},20,0)`);
    ctx.fillStyle = bg; ctx.fill();
    if (e.homing) { ctx.strokeStyle='rgba(255,200,0,.6)'; ctx.lineWidth=1.5; ctx.stroke(); }
  }

  // Cursor
  drawCursor();

  // Particles
  drawParticles();

  // HUD
  drawHUD();
}

function drawCursor() {
  const { x, y } = S.cursor;
  const p = Math.sin(S.frame * 0.08) * 2;
  const sc = S.beatFlash > 0 ? 1.3 : 1;
  const onB = S.beatFlash > 0;

  ctx.beginPath(); ctx.arc(x,y,(12+p)*sc,0,Math.PI*2);
  ctx.strokeStyle = onB ? 'rgba(0,229,160,0.9)' : 'rgba(0,229,160,0.4)';
  ctx.lineWidth = onB ? 2 : 1; ctx.stroke();

  ctx.beginPath(); ctx.arc(x,y,5*sc,0,Math.PI*2);
  ctx.fillStyle = '#00E5A0'; ctx.fill();

  const len=onB?24:20, gap=onB?15:13;
  ctx.strokeStyle = onB ? 'rgba(0,229,160,0.9)' : 'rgba(0,229,160,0.55)';
  ctx.lineWidth = 1;
  [[x-len,y,x-gap,y],[x+gap,y,x+len,y],[x,y-len,x,y-gap],[x,y+gap,x,y+len]]
    .forEach(([x1,y1,x2,y2])=>{ ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); });
}

function drawParticles() {
  for (const p of S.particles) {
    const a = p.life/p.max;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r*a,0,Math.PI*2);
    ctx.fillStyle = `hsla(${p.hue},100%,60%,${a})`; ctx.fill();
  }
}

function drawHUD() {
  const secs  = (S.time/60).toFixed(2);
  const bSecs = (S.bestTime/60).toFixed(2);
  const onB   = S.beatFlash > 0;

  ctx.textAlign = 'left';
  ctx.font = '16px "Press Start 2P", monospace';
  ctx.fillStyle = '#00E5A0';
  ctx.fillText(secs + 's', 18, 44);

  ctx.font = '7px "Press Start 2P", monospace';
  ctx.fillStyle = 'rgba(255,255,255,0.28)';
  ctx.fillText('BEST ' + bSecs + 's', 18, 62);

  ctx.textAlign = 'center';
  ctx.font = onB ? '10px "Press Start 2P", monospace' : '8px "Press Start 2P", monospace';
  ctx.fillStyle = onB ? '#00E5A0'
    : S.level >= 5 ? '#FF4D00'
    : S.level >= 3 ? '#FF9F0A'
    : 'rgba(255,255,255,0.5)';
  ctx.fillText('♩ ' + S.bpm + ' BPM', W/2, 28);

  ctx.textAlign = 'right';
  ctx.font = '8px "Press Start 2P", monospace';
  ctx.fillStyle = S.level >= 5 ? '#FF4D00' : S.level >= 3 ? '#FF9F0A' : 'rgba(255,255,255,0.3)';
  ctx.fillText('LV.' + S.level + '  x' + S.enemies.length, W-18, 44);
}

function drawIdle() {
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(0,0,W,H);
  ctx.textAlign = 'center';

  ctx.font = 'bold 72px "Fredoka One", cursive';
  ctx.fillStyle = '#F0EDE8';
  ctx.fillText('CURSOR', W/2, H/2-62);
  ctx.fillText('SURVIVOR', W/2, H/2-4);

  ctx.font = '9px "Press Start 2P", monospace';
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.fillText('마우스로 빨간 원을 피하세요', W/2, H/2+28);
  ctx.fillText('박자에 맞춰 원이 쏟아집니다', W/2, H/2+46);

  if (S.bestTime > 0) {
    ctx.font = '9px "Press Start 2P", monospace';
    ctx.fillStyle = '#00E5A0';
    ctx.fillText('BEST: ' + (S.bestTime/60).toFixed(2) + 's', W/2, H/2+68);
  }

  ctx.fillStyle = '#00E5A0';
  ctx.fillRect(W/2-110, H/2+82, 220, 46);
  ctx.font = '10px "Press Start 2P", monospace';
  ctx.fillStyle = '#000';
  ctx.fillText('▶  CLICK TO START', W/2, H/2+110);
}

function drawDead() {
  drawParticles();
  ctx.fillStyle = 'rgba(0,0,0,0.72)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign = 'center';

  ctx.font = 'bold 80px "Fredoka One", cursive';
  ctx.fillStyle = '#FF4D00';
  ctx.fillText('DEAD 💀', W/2, H/2-38);

  ctx.font = '20px "Press Start 2P", monospace';
  ctx.fillStyle = '#F0EDE8';
  ctx.fillText((S.time/60).toFixed(2)+'s', W/2, H/2+10);

  ctx.font = '9px "Press Start 2P", monospace';
  if (S.time >= S.bestTime && S.bestTime > 0) {
    ctx.fillStyle = '#FFD700'; ctx.fillText('★ NEW BEST! ★', W/2, H/2+36);
  } else {
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillText('BEST: '+(S.bestTime/60).toFixed(2)+'s', W/2, H/2+36);
  }

  ctx.fillStyle = '#F0EDE8';
  ctx.fillRect(W/2-90, H/2+58, 180, 44);
  ctx.font = '10px "Press Start 2P", monospace';
  ctx.fillStyle = '#000';
  ctx.fillText('↺  RETRY', W/2, H/2+85);
}

// ── Loop ──────────────────────────────────────────────────────
function loop() {
  if (S.phase === 'running') update();
  draw();
  requestAnimationFrame(loop);
}

S.cursor.x = typeof window !== 'undefined' ? window.innerWidth/2 : 400;
S.cursor.y = typeof window !== 'undefined' ? window.innerHeight/2 : 300;

loop();
</script>
</body>
</html>
